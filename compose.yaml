# Frontend on its own: the SPA in nginx on http://localhost:8080.
# /api goes to a backend on the host port 3000 (`pnpm dev` in backend/ or `pnpm stack:backend`).
#   from the repo root: pnpm stack:frontend
#   here:               docker compose up --build
# Included by the root compose.yaml, which points API_UPSTREAM at the api service.

services:
  web:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    image: resume-builder-frontend
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-host.docker.internal:3000}
    # Docker Desktop knows host.docker.internal; plain Docker Engine on Linux learns it here, as
    # the host's address on the bridge network. That address reaches a backend that listens on
    # every interface (`pnpm dev` in backend/), not one published on 127.0.0.1 only, as
    # `pnpm stack:backend` does: on Linux run the whole stack (`pnpm stack`) instead.
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 127.0.0.1:${WEB_PORT:-8080}:80
    restart: unless-stopped
